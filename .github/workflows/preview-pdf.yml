name: Update Preview PDF

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-pdf-${{ github.repository }}
  cancel-in-progress: true

jobs:
  update-preview-pdf:
    name: Update preview release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: lab/pyproject.toml
      - name: Install Chrome
        uses: browser-actions/setup-chrome@086160e580d6e8c142ad5ba29009dcde677c6321 # v2
        with:
          chrome-version: stable
      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra poppler-utils
      - name: Install verified mdpress 0.7.14
        env:
          MDPRESS_VERSION: "0.7.14"
          MDPRESS_SHA256: "6819dbc9bb606053afd9d65afb4fc4e58fb066ef6918d8a8e2497af6b528e0cb"
        run: |
          archive="/tmp/mdpress_${MDPRESS_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "https://github.com/yeasy/mdPress/releases/download/v${MDPRESS_VERSION}/mdpress_${MDPRESS_VERSION}_linux_amd64.tar.gz" -o "$archive"
          echo "${MDPRESS_SHA256}  $archive" | sha256sum -c -
          tar xzf "$archive" -C /tmp mdpress
          sudo install -m 0755 /tmp/mdpress /usr/local/bin/mdpress
          mdpress --version
      - name: Install pinned MiniHarness dependencies
        run: python -m pip install -e "./lab[dev]"
      - name: Validate preview inputs
        run: |
          python check_project_rules.py
          cd lab
          python -m pytest tests/integration/test_mcp_lifecycle.py -q
          python -m pytest tests -q --cov=mini_harness --cov-report=term-missing --cov-fail-under=80
          python -m mypy mini_harness
          python -m pylint mini_harness
          python -m build
      - name: Build latest preview PDF
        run: |
          mkdir -p dist
          mdpress build --format pdf --output dist/harness_engineering_guide.pdf
          title=$(python -c "import json; print(json.load(open('book.json', encoding='utf-8'))['title'])")
          python tools/verify_artifacts.py \
            --pdf dist/harness_engineering_guide.pdf \
            --expected-title "$title"
      - name: Write release notes
        run: |
          printf 'Auto-updated preview PDF from `%s`.\n\n- Branch: `%s`\n- Commit: https://github.com/%s/commit/%s\n- Run: https://github.com/%s/actions/runs/%s\n' \
            "${GITHUB_SHA::7}" \
            "$GITHUB_REF_NAME" \
            "$GITHUB_REPOSITORY" \
            "$GITHUB_SHA" \
            "$GITHUB_REPOSITORY" \
            "$GITHUB_RUN_ID" \
            > dist/release-notes.md
      - name: Create preview release when absent
        run: |
          if ! gh release view preview-pdf >/dev/null 2>&1; then
            gh release create preview-pdf \
              --title "Latest Preview PDF" \
              --notes-file dist/release-notes.md \
              --prerelease \
              --latest=false \
              --target "$GITHUB_SHA"
          fi
      - name: Update preview release metadata
        run: |
          gh release edit preview-pdf \
            --title "Latest Preview PDF" \
            --notes-file dist/release-notes.md \
            --prerelease \
            --target "$GITHUB_SHA"
      - name: Remove legacy preview asset when present
        run: |
          if gh release view preview-pdf --json assets --jq '.assets[].name' | grep -Fxq latest.pdf; then
            gh release delete-asset preview-pdf latest.pdf -y
          fi
      - name: Upload preview PDF
        run: gh release upload preview-pdf dist/harness_engineering_guide.pdf --clobber
