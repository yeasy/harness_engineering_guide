name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }} quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: lab/pyproject.toml
      - name: Install pinned MiniHarness dependencies
        run: python -m pip install -e "./lab[dev]"
      - name: Validate book content
        run: python check_project_rules.py && python check_emphasis.py
      - name: Run book contract tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run real MCP E2E lifecycle
        working-directory: lab
        run: python -m pytest tests/integration/test_mcp_lifecycle.py -q
      - name: Run tests with measured coverage
        working-directory: lab
        run: >-
          python -m pytest tests -q
          --cov=mini_harness
          --cov-report=term-missing
          --cov-fail-under=80
      - name: Type-check MiniHarness
        working-directory: lab
        run: python -m mypy mini_harness
      - name: Lint MiniHarness
        working-directory: lab
        run: python -m pylint mini_harness
      - name: Build Python distributions
        working-directory: lab
        run: python -m build

  artifacts:
    name: Build PDF, HTML, and Mermaid artifacts
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install Chrome
        id: setupchrome
        uses: browser-actions/setup-chrome@086160e580d6e8c142ad5ba29009dcde677c6321 # v2
        with:
          chrome-version: stable
      - name: Install Pandoc
        uses: pandoc/actions/setup@86321b6dd4675f5014c611e05088e10d4939e09e # v1
        with:
          version: 3.10
      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra poppler-utils
      - name: Resolve latest mdPress release
        run: |
          url="$(curl -fsSL --retry 3 -o /dev/null -w '%{url_effective}' https://github.com/yeasy/mdPress/releases/latest)"
          version="${url##*/v}"
          test -n "$version" || { echo "could not resolve latest mdPress release"; exit 1; }
          echo "MDPRESS_VERSION=$version" >> "$GITHUB_ENV"
          echo "resolved mdPress $version"
      - name: Install mdPress (checksum-verified)
        run: |
          archive="/tmp/mdpress_${MDPRESS_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "https://github.com/yeasy/mdPress/releases/download/v${MDPRESS_VERSION}/mdpress_${MDPRESS_VERSION}_linux_amd64.tar.gz" -o "$archive"
          expected="$(curl -fsSL --retry 3 "https://github.com/yeasy/mdPress/releases/download/v${MDPRESS_VERSION}/checksums.txt" \
            | awk -v f="mdpress_${MDPRESS_VERSION}_linux_amd64.tar.gz" '$2==f {print $1}')"
          test -n "$expected" || { echo "no published checksum for mdpress_${MDPRESS_VERSION}_linux_amd64.tar.gz"; exit 1; }
          echo "${expected}  $archive" | sha256sum -c -
          tar xzf "$archive" -C /tmp mdpress
          sudo install -m 0755 /tmp/mdpress /usr/local/bin/mdpress
          mdpress --version
      - name: Install pinned Mermaid CLI
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm install --global @mermaid-js/mermaid-cli@11.16.0
      - name: Build publication artifacts
        run: |
          # mdPress PDF generation drives headless Chrome, which intermittently dies with
          # "websocket url timeout reached" + dbus errors. Retry the build, not the whole job.
          mdpress() { local a; for a in 1 2 3; do command mdpress "$@" && return 0;
            echo "::warning::mdpress attempt $a failed; retrying in 10s"; sleep 10; done; return 1; }
          mkdir -p dist/mermaid
          mdpress build --format pdf --output dist/harness_engineering_guide.pdf
          python tools/render_mermaid.py --book-dir . --svg-out dist/mermaid --strict
          test "$(find dist/mermaid -name 'd-*.svg' -type f | wc -l)" -gt 0
          title=$(python -c "import json; print(json.load(open('book.json', encoding='utf-8'))['title'])")
          python tools/build_html_reader.py --book-dir . --title "$title" \
            --svg-dir dist/mermaid --out dist/harness_engineering_guide.html
          python tools/verify_artifacts.py \
            --book-dir . \
            --mermaid-dir dist/mermaid \
            --pdf dist/harness_engineering_guide.pdf \
            --html dist/harness_engineering_guide.html \
            --expected-title "$title"
          (
            cd dist
            sha256sum harness_engineering_guide.pdf harness_engineering_guide.html \
              > SHA256SUMS
          )
          python tools/verify_artifacts.py \
            --checksum-manifest dist/SHA256SUMS \
            --expected-title "$title"
      - name: Upload publication artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: harness-engineering-guide
          path: |
            dist/harness_engineering_guide.pdf
            dist/harness_engineering_guide.html
            dist/mermaid/*.svg
            dist/SHA256SUMS
          if-no-files-found: error
