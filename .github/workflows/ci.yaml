name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }} quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: lab/pyproject.toml
      - name: Install pinned MiniHarness dependencies
        run: python -m pip install -e "./lab[dev]"
      - name: Validate book content
        run: python check_project_rules.py
      - name: Run real MCP E2E lifecycle
        working-directory: lab
        run: python -m pytest tests/integration/test_mcp_lifecycle.py -q
      - name: Run tests with measured coverage
        working-directory: lab
        run: >-
          python -m pytest tests -q
          --cov=mini_harness
          --cov-report=term-missing
          --cov-fail-under=80
      - name: Type-check MiniHarness
        working-directory: lab
        run: python -m mypy mini_harness
      - name: Lint MiniHarness
        working-directory: lab
        run: python -m pylint mini_harness
      - name: Build Python distributions
        working-directory: lab
        run: python -m build

  artifacts:
    name: Build PDF, HTML, and Mermaid artifacts
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install Chrome
        id: setupchrome
        uses: browser-actions/setup-chrome@086160e580d6e8c142ad5ba29009dcde677c6321 # v2
        with:
          chrome-version: stable
      - name: Install Pandoc
        uses: pandoc/actions/setup@50931da58a60c003a5173d80d8c0cec597365bbe # v1
        with:
          version: 3.10
      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra poppler-utils
      - name: Install verified mdpress 0.7.13
        env:
          MDPRESS_VERSION: "0.7.14"
          MDPRESS_SHA256: "6819dbc9bb606053afd9d65afb4fc4e58fb066ef6918d8a8e2497af6b528e0cb"
        run: |
          archive="/tmp/mdpress_${MDPRESS_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "https://github.com/yeasy/mdPress/releases/download/v${MDPRESS_VERSION}/mdpress_${MDPRESS_VERSION}_linux_amd64.tar.gz" -o "$archive"
          echo "${MDPRESS_SHA256}  $archive" | sha256sum -c -
          tar xzf "$archive" -C /tmp mdpress
          sudo install -m 0755 /tmp/mdpress /usr/local/bin/mdpress
          mdpress --version
      - name: Install pinned Mermaid CLI
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm install --global @mermaid-js/mermaid-cli@11.16.0
      - name: Build publication artifacts
        run: |
          mkdir -p dist/mermaid
          mdpress build --format pdf --output dist/harness_engineering_guide.pdf
          python tools/render_mermaid.py --book-dir . --svg-out dist/mermaid --strict
          test "$(find dist/mermaid -name 'd-*.svg' -type f | wc -l)" -gt 0
          title=$(python -c "import json; print(json.load(open('book.json', encoding='utf-8'))['title'])")
          python tools/build_html_reader.py --book-dir . --title "$title" \
            --svg-dir dist/mermaid --out dist/harness_engineering_guide.html
          python tools/verify_artifacts.py \
            --book-dir . \
            --mermaid-dir dist/mermaid \
            --pdf dist/harness_engineering_guide.pdf \
            --html dist/harness_engineering_guide.html \
            --expected-title "$title"
          (
            cd dist
            sha256sum harness_engineering_guide.pdf harness_engineering_guide.html \
              > SHA256SUMS
          )
          python tools/verify_artifacts.py \
            --checksum-manifest dist/SHA256SUMS \
            --expected-title "$title"
      - name: Upload publication artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: harness-engineering-guide
          path: |
            dist/harness_engineering_guide.pdf
            dist/harness_engineering_guide.html
            dist/mermaid/*.svg
            dist/SHA256SUMS
          if-no-files-found: error
