name: Auto Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: lab/pyproject.toml
      - name: Install Chrome
        id: setupchrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable
      - name: Install Pandoc
        uses: pandoc/actions/setup@86321b6dd4675f5014c611e05088e10d4939e09e # v1.1.1
        with:
          version: 3.10
      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra poppler-utils
      - name: Resolve latest mdPress release
        run: |
          url="$(curl -fsSL --retry 3 -o /dev/null -w '%{url_effective}' https://github.com/yeasy/mdPress/releases/latest)"
          version="${url##*/v}"
          test -n "$version" || { echo "could not resolve latest mdPress release"; exit 1; }
          echo "MDPRESS_VERSION=$version" >> "$GITHUB_ENV"
          echo "resolved mdPress $version"
      - name: Install mdPress (checksum-verified)
        run: |
          archive="/tmp/mdpress_${MDPRESS_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "https://github.com/yeasy/mdPress/releases/download/v${MDPRESS_VERSION}/mdpress_${MDPRESS_VERSION}_linux_amd64.tar.gz" -o "$archive"
          expected="$(curl -fsSL --retry 3 "https://github.com/yeasy/mdPress/releases/download/v${MDPRESS_VERSION}/checksums.txt" \
            | awk -v f="mdpress_${MDPRESS_VERSION}_linux_amd64.tar.gz" '$2==f {print $1}')"
          test -n "$expected" || { echo "no published checksum for mdpress_${MDPRESS_VERSION}_linux_amd64.tar.gz"; exit 1; }
          echo "${expected}  $archive" | sha256sum -c -
          tar xzf "$archive" -C /tmp mdpress
          sudo install -m 0755 /tmp/mdpress /usr/local/bin/mdpress
          mdpress --version
      - name: Install pinned test and Mermaid dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          python -m pip install -e "./lab[dev]"
          npm install --global @mermaid-js/mermaid-cli@11.16.0
      - name: Validate release inputs
        run: |
          python check_project_rules.py
          python -m unittest discover -s tests -p 'test_*.py' -v
          cd lab
          python -m pytest tests/integration/test_mcp_lifecycle.py -q
          python -m pytest tests -q --cov=mini_harness --cov-report=term-missing --cov-fail-under=80
          python -m mypy mini_harness
          python -m pylint mini_harness
          python -m build
      - name: Derive safe artifact names
        id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag_name="${GITHUB_REF_NAME}"
          else
            tag_name="manual-${GITHUB_SHA::7}"
          fi
          safe_tag_name=$(printf '%s' "$tag_name" | sed 's/[^A-Za-z0-9._-]/-/g')
          safe_tag_name="${safe_tag_name:-latest}"
          echo "TAG_NAME=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "SAFE_TAG_NAME=${safe_tag_name}" >> "$GITHUB_OUTPUT"
      - name: Build PDF, HTML, and Mermaid artifacts
        run: |
          # mdPress PDF generation drives headless Chrome, which intermittently dies with
          # "websocket url timeout reached" + dbus errors. Retry the build, not the whole job.
          mdpress() { local a; for a in 1 2 3; do command mdpress "$@" && return 0;
            echo "::warning::mdpress attempt $a failed; retrying in 10s"; sleep 10; done; return 1; }
          mkdir -p dist/mermaid
          tag="${{ steps.tag.outputs.SAFE_TAG_NAME }}"
          mdpress build --format pdf --output "dist/harness_engineering_guide-${tag}.pdf"
          python tools/render_mermaid.py --book-dir . --svg-out dist/mermaid --strict
          test "$(find dist/mermaid -name 'd-*.svg' -type f | wc -l)" -gt 0
          title=$(python -c "import json; print(json.load(open('book.json', encoding='utf-8'))['title'])")
          python tools/build_html_reader.py --book-dir . --title "$title" \
            --svg-dir dist/mermaid --out "dist/harness_engineering_guide-${tag}.html"
          python tools/verify_artifacts.py \
            --book-dir . \
            --mermaid-dir dist/mermaid \
            --pdf "dist/harness_engineering_guide-${tag}.pdf" \
            --html "dist/harness_engineering_guide-${tag}.html" \
            --expected-title "$title"
          (
            cd dist
            sha256sum \
              "harness_engineering_guide-${tag}.pdf" \
              "harness_engineering_guide-${tag}.html" > SHA256SUMS
          )
          python tools/verify_artifacts.py \
            --checksum-manifest dist/SHA256SUMS \
            --expected-title "$title"
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/harness_engineering_guide-${{ steps.tag.outputs.SAFE_TAG_NAME }}.pdf
            dist/harness_engineering_guide-${{ steps.tag.outputs.SAFE_TAG_NAME }}.html
            dist/SHA256SUMS
      - name: Upload verified artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harness-engineering-guide-${{ steps.tag.outputs.SAFE_TAG_NAME }}
          path: |
            dist/harness_engineering_guide-${{ steps.tag.outputs.SAFE_TAG_NAME }}.pdf
            dist/harness_engineering_guide-${{ steps.tag.outputs.SAFE_TAG_NAME }}.html
            dist/mermaid/*.svg
            dist/SHA256SUMS
          if-no-files-found: error
