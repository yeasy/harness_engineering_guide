[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mini_harness"
version = "0.1.0"
description = "A minimal but complete Harness system for AI Agents"
readme = "README.md"
requires-python = ">=3.11"
license = "CC-BY-NC-SA-4.0"
authors = [
    {name = "yeasy", email = "yangbaohua@gmail.com"}
]

dependencies = [
    "pydantic==2.13.4",
    "httpx==0.28.1",
    "python-dotenv==1.2.2",
    "anthropic==0.116.0",
    "openai==2.45.0",
    "pyyaml==6.0.3",
    "mcp==1.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "black==26.5.1",
    "pylint==4.0.6",
    "mypy==2.2.0",
    "isort==8.0.1",
    "pytest-cov==7.1.0",
    "build==1.5.1",
    "types-PyYAML==6.0.12.20260518",
]

[project.urls]
Homepage = "https://github.com/yeasy/harness_engineering_guide"
Documentation = "https://yeasy.gitbook.io/harness_engineering_guide/"

[tool.setuptools.packages.find]
where = ["."]
include = ["mini_harness*"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pylint.main]
fail-under = 9.0
py-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "auto"
